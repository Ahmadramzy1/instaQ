<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#031510">
<meta name="description" content="صف پخش لینک‌های اینستاگرام ارسالی در چت کیک — پخش خودکار رییل و پست به ترتیب ارسال">
<title>صف اینستاگرام | چت کیک</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://corsproxy.io"><link rel="preconnect" href="https://api.allorigins.win"><link rel="preconnect" href="https://api.codetabs.com"><link rel="preconnect" href="https://d.ddinstagram.com"><link rel="preconnect" href="https://www.instagram.com">
<style>
:root{
 --a1:#19dfbd;--a2:#13c9ac;--a3:#bded38;--ok:#34d399;--warn:#f5b942;--danger:#f0625a;
 --r:24px;--rs:14px;--font:'Vazirmatn',system-ui,sans-serif;
 --grad:linear-gradient(135deg,var(--a1),var(--a2));--on-accent:#023b2e;
 --bg:#031510;--glass:rgba(8,39,29,.88);--s2:rgba(255,255,255,.045);--s3:rgba(255,255,255,.09);
 --border:rgba(169,235,203,.18);--text:#e0f6ed;--muted:#8eafa3;
 --shadow:0 24px 50px -24px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.3);
 --ease:cubic-bezier(.2,.8,.2,1)
}
[data-theme="light"]{
 --bg:#e4f5ec;--glass:rgba(255,255,255,.72);--s2:rgba(15,68,48,.04);--s3:rgba(15,68,48,.08);
 --border:rgba(15,68,48,.09);--text:#123d30;--muted:#507567;
 --shadow:0 22px 40px -24px rgba(10,58,40,.32),0 1px 3px rgba(10,58,40,.08)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{height:100dvh;background:var(--bg);color:var(--text);font:14px/1.6 var(--font);display:flex;flex-direction:column;overflow:hidden;
 padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
 -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---- ambient background ---- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:float 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--a1);top:-18vmax;inset-inline-start:-12vmax}
.bg i:nth-child(2){background:var(--a2);bottom:-22vmax;inset-inline-end:-12vmax;animation-delay:-8s}
.bg i:nth-child(3){background:var(--a3);top:35%;left:40%;width:24vmax;height:24vmax;opacity:.1;animation-delay:-15s}
[data-theme="light"] .bg i{opacity:.16}
.bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 5%,transparent 65%);mask-image:radial-gradient(ellipse at 50% 0%,#000 5%,transparent 65%);opacity:.55}
@keyframes float{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--border);box-shadow:var(--shadow)}

/* ---- header ---- */
.top{position:relative;z-index:10;display:flex;align-items:center;gap:14px;margin:12px 16px 0;padding:10px 14px;border-radius:var(--r);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:6px;perspective:400px}
.logo{flex:none;filter:drop-shadow(0 8px 16px rgba(19,201,172,.45));transition:transform .6s var(--ease)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
html.fx3d .brand:hover .logo{transform:rotateY(-24deg) rotateX(12deg) scale(1.08)}
.brandtext{display:flex;flex-direction:column;line-height:1.3}
.brandtext b{font-size:17px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--text),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.brandtext span{font-size:12px;color:var(--muted)}
.conn{display:flex;gap:8px}
.in{display:flex;align-items:center;direction:ltr;height:40px;background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);padding:0 12px;transition:border-color .2s,box-shadow .2s}
.in:hover{border-color:var(--s3)}
.in:focus-within{border-color:var(--a2);box-shadow:0 0 0 4px rgba(19,201,172,.15)}
.in span{color:var(--muted);font-size:13px}
.in input{background:none;border:0;color:var(--text);font:inherit;padding:0 4px;width:150px;outline:0;height:100%}
.go{position:relative;overflow:hidden;height:40px;background:var(--grad);color:#fff;font-weight:700;padding:0 22px;border-radius:var(--rs);box-shadow:0 10px 22px -10px rgba(19,201,172,.8);transition:transform .18s var(--ease),box-shadow .2s}
.go::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s var(--ease)}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(19,201,172,.9)}
.go:hover::after{transform:translateX(130%)}
.go:active{transform:translateY(0) scale(.97)}
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:99px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:13px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.on{color:var(--text)}.pill.on i{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:ping 1.8s infinite}
.pill.wait i{background:var(--warn);animation:blink 1s infinite}.pill.err i{background:var(--danger)}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes blink{50%{opacity:.3}}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--s2);display:grid;place-items:center;font-size:15px;transition:transform .2s var(--ease),background .2s,border-color .2s}
.icon-btn:hover{background:var(--s3);transform:translateY(-2px);border-color:var(--a1)}
#langBtn,#fxBtn{width:auto;padding:0 14px;border-radius:99px;font-weight:800;font-size:12px}
#fxBtn[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(19,201,172,.8)}
#fxBtn[hidden]{display:none}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;height:40px;display:flex;align-items:center;gap:6px;padding:0 14px;border:1px solid var(--border);border-radius:var(--rs);background:var(--s2);transition:background .2s,border-color .2s}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover{background:var(--s3);border-color:var(--a1)}
.menu div{position:absolute;inset-inline-end:0;top:calc(100% + 8px);border-radius:14px;padding:6px;min-width:210px;z-index:20;display:flex;flex-direction:column;animation:pop .2s var(--ease);transform-origin:top}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu div button{text-align:start;padding:10px 12px;border-radius:9px;transition:background .15s,padding .2s}
.menu div button:hover{background:var(--s3);padding-inline-start:16px}
.menu div button[hidden]{display:none}
.menu div hr{border:0;border-top:1px solid var(--border);margin:4px 6px}
.menu div .dng{color:var(--danger)}

/* ---- layout ---- */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:minmax(0,1fr);gap:16px;padding:14px 16px 16px}
.stage{display:flex;flex-direction:column;gap:12px;min-height:0}
.frame{flex:1;min-height:240px;position:relative;background:radial-gradient(ellipse at 50% 30%,#0c392c,#02100c 72%);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .5s}
.frame.live{box-shadow:0 0 0 1px rgba(25,223,189,.35),0 30px 80px -30px rgba(19,201,172,.65)}
.frame:fullscreen{border-radius:0;border:0}
.frame.swap{animation:fade .45s var(--ease)}
@keyframes fade{from{opacity:.3}}
.scr{position:absolute;inset:0;display:grid;place-items:center}
.scr video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
.emb{position:absolute;left:50%;top:50%;width:540px;transform-origin:center}
.emb iframe{width:100%;height:100%;border:0;background:#fff;display:block;border-radius:10px}
.msg{text-align:center;padding:24px;max-width:460px;color:#9bbcaf;position:relative;z-index:1}
.msg p{color:#fff;font-size:18px;font-weight:800;margin-bottom:6px}
.msg small{display:block;margin-top:14px;font-size:12px;color:#8eafa3}
.ei{width:78px;height:78px;margin:0 auto 18px;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(19,201,172,.45))}
.ei.seal-i{width:144px;height:144px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-8px)}}
.acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.acts button{padding:9px 16px;border:1px solid rgba(255,255,255,.14);border-radius:var(--rs);background:rgba(255,255,255,.06);color:#fff;transition:transform .2s var(--ease),border-color .2s,background .2s}
.acts button:hover{border-color:var(--a2);background:rgba(19,201,172,.18);transform:translateY(-2px)}
.sp{display:block;width:34px;height:34px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--a2);border-inline-end-color:var(--a1);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.now{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;padding:0 4px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-size:15px;direction:ltr;text-align:start;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--grad);box-shadow:0 0 0 3px var(--bg),0 0 0 5px rgba(25,223,189,.5);transition:transform .3s var(--ease)}
.av:hover{transform:scale(1.08) rotate(-6deg)}
.nr{display:flex;align-items:center;gap:8px}
.posb{font-size:12px;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--border)}
.posb:empty{display:none}
#rt{width:36px;height:36px;font-size:14px}
#open{display:flex;align-items:center;gap:6px;color:var(--a2);text-decoration:none;font-size:13px;font-weight:700;border:1px solid var(--border);padding:7px 14px;border-radius:var(--rs);white-space:nowrap;background:var(--s2);transition:transform .2s var(--ease),border-color .2s,background .2s}
#open:hover{border-color:var(--a2);background:rgba(19,201,172,.12);transform:translateY(-2px)}
#open[hidden]{display:none}
#rt[hidden]{display:none}

.dock{border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.tl{direction:ltr;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bar{position:relative;flex:1;height:22px;display:flex;align-items:center}
.bf{position:absolute;left:0;height:5px;background:var(--s3);border-radius:3px;width:0;pointer-events:none;transition:height .2s}
#sk{-webkit-appearance:none;appearance:none;position:relative;width:100%;height:5px;border-radius:3px;cursor:pointer;outline-offset:4px;transition:height .2s;
 background:linear-gradient(90deg,var(--a1),var(--a2) var(--p,0%),transparent var(--p,0%))}
.bar:hover #sk,.bar:hover .bf{height:8px}
#sk::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--a2);box-shadow:0 2px 8px rgba(0,0,0,.4);transform:scale(.7);transition:transform .2s}
.bar:hover #sk::-webkit-slider-thumb{transform:scale(1)}
#sk::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--a2)}
.tip{position:absolute;bottom:26px;transform:translateX(-50%) translateY(4px);padding:3px 8px;border-radius:7px;background:var(--text);color:var(--bg);font-size:11px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;white-space:nowrap}
.tip.on{opacity:1;transform:translateX(-50%) translateY(0)}
.row{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl{direction:ltr}
.ib{width:40px;height:40px;border-radius:50%;font-size:15px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--border);line-height:1;transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.ib svg{width:18px;height:18px;fill:currentColor}
.ib:hover{background:var(--s3);transform:translateY(-3px);box-shadow:0 10px 18px -10px rgba(0,0,0,.6)}
.ib:active{transform:scale(.92)}
.ib small{font-size:9px;display:block;margin-top:-2px}
.ib.pp{width:54px;height:54px;color:#fff;border:0;background:var(--grad);box-shadow:0 10px 24px -8px rgba(19,201,172,.75)}
.ib.pp svg{width:22px;height:22px}
.ib.pp:hover{filter:brightness(1.1);transform:translateY(-3px) scale(1.04)}
.ib.pp.playing{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,223,189,.55),0 10px 24px -8px rgba(19,201,172,.75)}70%{box-shadow:0 0 0 12px rgba(25,223,189,0),0 10px 24px -8px rgba(19,201,172,.75)}100%{box-shadow:0 0 0 0 rgba(25,223,189,0),0 10px 24px -8px rgba(19,201,172,.75)}}
.chip{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--s2);transition:color .2s,background .2s,transform .2s var(--ease),border-color .2s}
.chip:hover{color:var(--text);border-color:var(--a1);transform:translateY(-2px)}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--grad);box-shadow:0 6px 16px -8px rgba(19,201,172,.8)}
.chip.lock[aria-pressed="true"]{background:linear-gradient(135deg,var(--warn),var(--danger));box-shadow:0 6px 16px -8px rgba(240,98,90,.8)}

/* ---- queue ---- */
aside{border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.qh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.qh h2{font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.qh h2 #cnt{color:var(--muted);font-weight:500;font-size:12px}
#list{overflow:auto;flex:1;padding:10px;display:flex;flex-direction:column;gap:10px;perspective:900px}
.it{position:relative;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;cursor:pointer;border:1px solid var(--border);background:linear-gradient(145deg,rgba(113,214,167,.08),rgba(2,20,14,.12));transform-style:preserve-3d;
 transition:transform .3s var(--ease),background .2s,box-shadow .3s,opacity .2s,border-color .2s}
.it:hover{background:var(--s2);border-color:var(--border)}
html.fx3d .it:hover{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(16px);box-shadow:0 20px 30px -20px rgba(0,0,0,.65)}
.it.on{background:linear-gradient(135deg,rgba(25,223,189,.2),rgba(19,201,172,.08));border-color:rgba(25,223,189,.4)}
.it.on::before{content:'';position:absolute;inset-block:14px;inset-inline-start:-1px;width:3px;border-radius:3px;background:var(--grad)}
.it.seen{opacity:.45}.it.seen:hover,.it.on.seen{opacity:.9}
.it[hidden]{display:none}
.it .n{width:18px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.th{position:relative;flex:none;width:58px;height:84px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--s3),var(--s2));box-shadow:0 6px 14px -8px rgba(0,0,0,.6)}
.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:transform .5s var(--ease)}
.it:hover .th video{transform:scale(1.1)}
.po{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s;z-index:1}
.po svg{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));transform:scale(.7);transition:transform .25s var(--ease)}
.it:hover .po{opacity:1}.it:hover .po svg{transform:scale(1)}
.it.on .po{display:none}
.th .bd{position:absolute;inset-inline-start:4px;bottom:4px;z-index:2;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.th .bd:empty{display:none}
.mini{width:11px;height:11px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:14px}
.it .tx small{color:var(--muted);font-size:12px}
.x{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted);opacity:0;transform:scale(.7);transition:opacity .2s,transform .2s var(--ease),background .2s,color .2s}
.it:hover .x,.it:focus-within .x{opacity:1;transform:scale(1)}
.x:hover{background:rgba(240,98,90,.15);color:var(--danger)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}.eq i{width:3px;background:#fff;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.it.new{animation:fl 1.4s var(--ease)}
@keyframes fl{from{background:rgba(25,223,189,.45);transform:translateX(-12px)}}
.lm{margin:auto;color:var(--muted);text-align:center;padding:30px 16px;font-size:13px}

.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;transition:opacity .3s,transform .35s var(--ease);direction:inherit;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ---- BW CULT title ---- */
.cultbar{position:relative;z-index:10;display:flex;justify-content:center;padding:10px 16px 0;direction:ltr}
.cult{font-family:var(--font);font-weight:900;font-size:26px;line-height:1.1;letter-spacing:.22em;margin-inline-end:-.22em;user-select:none;transition:font-size .45s var(--ease)}
.cult .r{color:#e0192b;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:0 0 22px rgba(224,25,43,.55)}
.cult .k{color:#000;-webkit-text-stroke:1.5px #e0192b;paint-order:stroke fill;text-shadow:0 0 22px rgba(224,25,43,.4)}
body.locked .cult{font-size:clamp(36px,9vw,64px);letter-spacing:.16em}

/* ---- login screen ---- */
.login{flex:1;min-height:0;display:grid;place-items:center;padding:16px;overflow:auto}
.lgcard{width:min(440px,100%);border-radius:24px;padding:28px 26px;display:flex;flex-direction:column;gap:14px;text-align:center;animation:pop .35s var(--ease)}
.lgcard h1{font-size:22px;font-weight:800}
.lgcard>p{color:var(--muted);font-size:13px;margin-top:-6px}
.lin{height:50px;gap:8px}
.lin svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lin input{flex:1;width:auto;min-width:0;text-align:center;font-size:15px}
.lgcard .go{height:48px;width:100%;font-size:15px}
.lmsg{min-height:22px;font-size:13px;color:var(--muted)}
.lmsg.err{color:var(--danger)}.lmsg.wait{color:var(--warn)}

/* ---- full-height player: info bar + controls float over the picture ---- */

.frame .now,.frame .dock{pointer-events:none}
.frame .now>*,.frame .dock>*{pointer-events:auto}
.frame.live.idle{cursor:none}
.frame.live.idle .now:not(:hover):not(:focus-within){opacity:0;transform:translateY(-10px)}
.frame.live.idle .dock:not(:hover):not(:focus-within){opacity:0;transform:translateY(10px)}
.frame.hasemb .scr{top:60px;bottom:140px}

document.addEventListener('click',e=>{const m=$('.menu');if(m.open&&!m.contains(e.target))closeMenu()});
$('#clr').onclick=()=>{Q.forEach(it=>{it.dropped=1;it.ac&&it.ac.abort();if(it.el)IO.unobserve(it.el)});
 Q.length=0;RQ.length=0;seen.clear();cur=-1;V=null;$('#list').innerHTML='';
 addedCount=0;lsSet('cap_added','0');   /* clearing the queue also resets the intake counter */
 lsDel('queue');   /* wipe every trace of the saved page state */
 resetHead();idleScreen();render();closeMenu();toast(t('cacheCleared'))};
$('#cls').onclick=()=>{for(let i=Q.length-1;i>=0;i--)if(Q[i].seen&&i!==cur)removeAt(i);closeMenu()};
$('#rs').onclick=()=>{const v=prompt(t('resolverPrompt'),lsGet('resolver')||'');if(v!==null)lsSet('resolver',v.trim());closeMenu()};
$('#capBtn').onclick=()=>{const v=prompt(t('capLimitPrompt'),capLimit>0?String(capLimit):'');closeMenu();if(v===null)return;
 const n=parseInt(v.trim(),10);capLimit=(Number.isFinite(n)&&n>0)?n:0;lsSet('cap_limit',String(capLimit));
 if(capLimit>0&&addedCount>=capLimit)toast(t('capReached'));else if(capLimit>0)toast(t('capSet')(capLimit));else toast(t('capCleared'));
 render()};
$('#userCapBtn').onclick=()=>{const v=prompt(t('userCapPrompt'),userCap>0?String(userCap):'');closeMenu();if(v===null)return;
 const n=parseInt(v.trim(),10);userCap=(Number.isFinite(n)&&n>0)?n:0;lsSet('cap_peruser',String(userCap));
 toast(userCap>0?t('userCapSet')(userCap):t('userCapCleared'));paintCaps()};
const setPk=()=>{const v=prompt(t('pusherPrompt'),lsGet('pusher_key')||'');closeMenu();if(v===null)return;lsSet('pusher_key',v.trim());if($('#ch').value.trim())connect()};
$('#pk').onclick=setPk;$('#pk2').onclick=setPk;
$('#chg').onclick=()=>{closeMenu();closeWs();setStatus('','notConnected');lockUI(true);$('#ch').focus()};
$('#go').onclick=connect;$('#ch').onkeydown=e=>{if(e.key==='Enter')connect()};

/* timeline + hover tooltip */
const sk=$('#sk'),bar=$('.bar'),tip=$('#tip');
sk.oninput=()=>{drag=true;if(V&&V.duration)V.currentTime=sk.value/1000*V.duration;sk.style.setProperty('--p',sk.value/10+'%')};
sk.onchange=()=>{drag=false};
bar.addEventListener('pointermove',e=>{const r=bar.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
 tip.style.left=x*100+'%';tip.textContent=V&&V.duration?fmt(x*V.duration):'0:00';tip.classList.add('on')});
bar.addEventListener('pointerleave',()=>tip.classList.remove('on'));
(function tick(){
 const pl=!!V&&!V.paused;
 if(pl!==lastP){lastP=pl;$('#pp').innerHTML=pl?IC.pause:IC.play;$('#pp').classList.toggle('playing',pl);$('#list').classList.toggle('paused',!pl);$('#frame').classList.toggle('live',pl)}
 if(V){const d=V.duration||0,it=Q[cur];
  if(d&&!drag){sk.value=V.currentTime/d*1000;sk.style.setProperty('--p',V.currentTime/d*100+'%')}
  $('#tc').textContent=fmt(V.currentTime);$('#td').textContent=fmt(d);
  if(V.buffered.length&&d)$('#bf').style.width=V.buffered.end(V.buffered.length-1)/d*100+'%';
  if(it&&!it.seen&&V.currentTime>=3){it.seen=true;render()}}
 else{$('#tc').textContent=$('#td').textContent='0:00';sk.value=0;sk.style.setProperty('--p','0%');$('#bf').style.width='0'}
 requestAnimationFrame(tick)})();
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range'||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
 if(k==='n')next();if(k==='p')play(cur-1);if(k==='m')$('#mu').click();if(k==='f')fs();
 if(e.key==='Delete'&&cur>=0){removeAt(cur,true);return}
 if(!V)return;
 if(e.key===' '){e.preventDefault();$('#pp').click()}
 if(e.key==='ArrowLeft'){e.preventDefault();V.currentTime-=5}if(e.key==='ArrowRight'){e.preventDefault();V.currentTime+=5}});

/* ---- init ---- */
applyTheme(lsGet('ui_theme')||'dark');
applyFx(false);
loadQueue();
applyLang(lsGet('ui_lang')||'fa');
const q=new URLSearchParams(location.search).get('c'),savedCh=lsGet('kick_ch');
if(savedCh)$('#ch').value=savedCh;   /* login page opens pre-filled with the last channel */
if(q){$('#ch').value=q;connect()}
</script>
</body>
</html>
