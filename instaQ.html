/* ==== Dusk design language: tokens (accent retuned to the seal blue #3069a6) ==== */
:root{
 color-scheme:dark;

 --dur-fast:140ms;--dur-base:240ms;--dur-slow:400ms;--dur-reveal:700ms;
 --ease-out:cubic-bezier(.23,1,.32,1);--ease-move:cubic-bezier(.77,0,.175,1);

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--paper);-webkit-text-size-adjust:100%}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---- type roles ---- */
.figure{font-family:var(--font-code);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.03em;font-weight:500}

/* ---- glass ---- */
.glass{position:relative;background:linear-gradient(180deg,rgb(255 255 255/.07),rgb(255 255 255/.03));border:1px solid var(--hairline)}
.glass::before{content:"";position:absolute;inset:0 0 auto;height:1px;pointer-events:none;border-radius:inherit;opacity:.8;

@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){

/* ---- ambient: aurora + grain (behind everything, so the video stays clean) + dusk shader on the login screen ---- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;
 -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%);mask-image:linear-gradient(180deg,#000 30%,transparent 100%)}

.glow-ring-beam::before{content:"";position:absolute;inset:-100%;will-change:transform;
 background:conic-gradient(from 0deg,transparent 0deg,rgb(106 168 236/.9) 60deg,rgb(63 163 217/.6) 110deg,transparent 170deg,transparent 230deg,rgb(74 95 214/.5) 280deg,transparent 360deg);

 transition:box-shadow var(--dur-slow) var(--ease-out),border-color var(--dur-slow) var(--ease-out)}

 background:linear-gradient(rgb(6 6 9/.75),transparent);transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out)}

 background:linear-gradient(transparent,rgb(6 6 9/.85));transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out)}
.now,.dock{pointer-events:none}

.tl{direction:ltr;display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:12px;line-height:16px}
.bar{position:relative;flex:1;height:24px;display:flex;align-items:center}

 transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}

.row{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap}

 transition:color var(--dur-fast) var(--ease-out),background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}

 addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;pos.x=e.clientX;pos.y=e.clientY;last=performance.now();if(!f)f=requestAnimationFrame(tick);
  const tg=e.target instanceof Element?e.target:null;
  if(tg&&tg.closest('#frame')){if(shown)show(false);return}
  if(!shown){ez.x=pos.x;ez.y=pos.y;show(true)}
  const el=tg&&tg.closest(INT);ring.toggleAttribute('data-active',!!el);ring.toggleAttribute('data-quiet',!!el&&el.matches('input,textarea'))},{passive:true});

/* dusk shader: WebGL flow field behind the login screen. Starts on the first interaction, never during load;
   skipped under reduced motion, on software renderers, data-saver, ≤2 GB devices and for webdriver */
function duskShader(canvas,level){if(CALM)return;
 const EV=['pointermove','touchstart','keydown'];
 const begin=()=>{if(!document.body.classList.contains('locked'))return;EV.forEach(n=>removeEventListener(n,begin));startDusk(canvas,level)};
 EV.forEach(n=>addEventListener(n,begin,{passive:true}))}
function startDusk(canvas,level){
 const nav=navigator;if(nav.webdriver||nav.connection?.saveData||(nav.deviceMemory!==undefined&&nav.deviceMemory<=2))return;
 const gl=canvas.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power',failIfMajorPerformanceCaveat:true});
 if(!gl||gl.isContextLost())return;
 const info=gl.getExtension('WEBGL_debug_renderer_info');
 if(/swiftshader|llvmpipe|software|mesa offscreen/i.test(String(gl.getParameter(info?info.UNMASKED_RENDERER_WEBGL:gl.RENDERER))))return;
 const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return gl.getShaderParameter(s,gl.COMPILE_STATUS)?s:null};
 const vs=sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'),fs=sh(gl.FRAGMENT_SHADER,DUSK_FS),pg=gl.createProgram();
 if(!vs||!fs)return;gl.attachShader(pg,vs);gl.attachShader(pg,fs);gl.linkProgram(pg);if(!gl.getProgramParameter(pg,gl.LINK_STATUS))return;
 gl.useProgram(pg);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const ap=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
 const U={};['res','time','pointer','intensity','fade'].forEach(n=>U[n]=gl.getUniformLocation(pg,'u_'+n));
 const target={x:.65,y:.6},ptr={x:.65,y:.6};let smooth=level(),visible=false,running=false,frame=0,last=0,fade=0;const t0=performance.now();
 addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();if(!r.width)return;target.x=(e.clientX-r.left)/r.width;target.y=1-(e.clientY-r.top)/r.height},{passive:true});
 const resize=()=>{const r=canvas.getBoundingClientRect(),k=Math.min(devicePixelRatio||1,r.width<768?.6:1.25);
  canvas.width=Math.max(1,Math.round(r.width*k));canvas.height=Math.max(1,Math.round(r.height*k));gl.viewport(0,0,canvas.width,canvas.height)};
 resize();new ResizeObserver(resize).observe(canvas);
 new IntersectionObserver(([e])=>{visible=e.isIntersecting}).observe(canvas);   /* display:none once connected → paused */
 const draw=now=>{frame=requestAnimationFrame(draw);
  const on=visible&&!document.hidden;
  if(on!==running){running=on;document.documentElement.toggleAttribute('data-shader',on)}   /* aurora pauses only while the shader is live */
  if(!on||now-last<32)return;last=now;   /* 30 fps */
  ptr.x+=(target.x-ptr.x)*.06;ptr.y+=(target.y-ptr.y)*.06;smooth+=(level()-smooth)*.04;fade=Math.min(1,fade+.02);
  gl.uniform2f(U.res,canvas.width,canvas.height);gl.uniform1f(U.time,(now-t0)/1000);gl.uniform2f(U.pointer,ptr.x,ptr.y);
  gl.uniform1f(U.intensity,smooth);gl.uniform1f(U.fade,fade);gl.drawArrays(gl.TRIANGLES,0,3)};
 frame=requestAnimationFrame(draw);
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(frame);document.documentElement.removeAttribute('data-shader');canvas.style.opacity='0'})}
/* simplex noise after Ian McEwan / Ashima Arts (MIT); scrim keeps the login card and wordmark at 4.5:1 */
const DUSK_FS=`precision highp float;
uniform vec2 u_res;uniform float u_time;uniform vec2 u_pointer;uniform float u_intensity;uniform float u_fade;
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
float snoise(vec2 v){const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
 vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
 vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod289(i);vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
 vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);m=m*m;m=m*m;
 vec3 x=2.0*fract(p*C.www)-1.0;vec3 h=abs(x)-0.5;vec3 ox=floor(x+0.5);vec3 a0=x-ox;m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
 vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.0*dot(m,g);}
void main(){vec2 uv=gl_FragCoord.xy/u_res;float aspect=u_res.x/u_res.y;vec2 p=vec2(uv.x*aspect,uv.y);float t=u_time*0.045;
 vec2 q=vec2(snoise(p*0.9+vec2(t,-t*0.7)),snoise(p*0.9+vec2(-t*0.6,t)+3.1));
 vec2 r=vec2(snoise(p*1.25+q*0.85+vec2(t*0.5,1.7)),snoise(p*1.25+q*0.85+vec2(7.3,-t*0.4)));float n=snoise(p*0.75+r*0.9);
 vec2 pp=vec2(u_pointer.x*aspect,u_pointer.y);float d=length(p-pp);float lamp=exp(-d*d*3.5);
 vec3 ink=vec3(0.035,0.035,0.059);vec3 apricot=vec3(0.42,0.66,0.93);vec3 pome=vec3(0.25,0.64,0.85);vec3 violet=vec3(0.19,0.41,0.65);
 float a=smoothstep(-0.1,0.75,n*1.1+lamp*0.45);float b=smoothstep(-0.3,0.8,r.x);vec3 col=mix(mix(violet,pome,b),apricot,a);
 float energy=0.3+0.16*u_intensity;float sky=smoothstep(0.0,0.9,uv.y);
 vec2 c=vec2((p.x-0.5*aspect)/(0.5*aspect),(uv.y-0.46)/0.4);float scrim=1.0-0.75*exp(-dot(c,c)*0.9);
 float headerBand=1.0-0.6*smoothstep(0.78,0.97,uv.y);
 float field=energy*(0.2+0.8*a)*(0.4+0.6*sky)*scrim*headerBand;
 vec3 outc=ink+col*field+apricot*lamp*(0.06+0.06*u_intensity)*scrim*headerBand;
 outc=mix(ink,outc,smoothstep(0.0,0.55,uv.y));outc=mix(ink,outc,u_fade);gl_FragColor=vec4(outc,1.0);}`;
spotlight($('aside'));magnetic($('#go'));cursor();
/* the dusk brightens as the channel name is typed and peaks while connecting */
duskShader($('#dusk'),()=>STK==='finding'?1:Math.min(1,$('#ch').value.trim().length/14));

applyLang(lsGet('ui_lang')||'fa');
const q=new URLSearchParams(location.search).get('c'),savedCh=lsGet('kick_ch');
if(savedCh)$('#ch').value=savedCh;   /* login page opens pre-filled with the last channel */
